name: Update GitHub Profile

on:
  schedule:
    - cron: "0 18 * * *"   # daily
  workflow_dispatch:        # manual run
  push:
    branches:
      - main
    paths:
      - "scripts/generate_skyline.py"
      - "scripts/analyze_github.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze GitHub profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/analyze_github.py

      - name: Generate skyline SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_skyline.py assets/skyline.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/skyline.svg
          git diff --cached --quiet || git commit -m "chore: update 3D skyline"
          git push
